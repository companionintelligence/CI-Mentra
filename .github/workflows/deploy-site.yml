name: Deploy mentra.ci.computer

# Setup guide + companion UI demo, served by a Cloudflare Worker with static
# assets (site/wrangler.jsonc). Deploys when the site, the companion UI it
# embeds, or the build script change on main; can also be dispatched by hand.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'public/**'
      - 'scripts/build-site.sh'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pre-check required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN is not set"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not set"; exit 1; }
      - run: npm ci
      - name: Test site worker + env builder
        run: npx jest site
      - name: Build assets
        env:
          # Optional GA4 measurement ID (G-XXXX); unset = no analytics emitted.
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: npm run site:build
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config site/wrangler.jsonc --var SITE_VERSION:${GITHUB_SHA::7}
      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS https://mentra.ci.computer/healthz && exit 0
            sleep 10
          done
          echo "::error::mentra.ci.computer/healthz did not come up"; exit 1
