name: Deploy mentra.ci.computer

# Setup guide + companion UI demo, served by a Cloudflare Worker with static
# assets (site/wrangler.jsonc). Deploys when the site, the companion UI it
# embeds, or the build scripts (including the SEO/GA/cross-link injectors) change
# on main; can also be dispatched by hand.
# >>> ci-local:gated original triggers below, restore with `ci-local restore`
# on:
#   push:
#     branches: [main]
#     paths:
#       - 'site/**'
#       - 'public/**'
#       - 'scripts/build-site.sh'
#       - 'scripts/inject-*.mjs'
#       - 'scripts/version-assets.mjs'
#       - 'scripts/vendor-brand.sh'
#       - '.github/workflows/deploy-site.yml'
#   workflow_dispatch:
# <<< ci-local:gated
on:
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so sitemap lastmod reflects real file dates
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pre-check required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN is not set"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not set"; exit 1; }
      - run: npm ci
      - name: Test site worker + env builder
        run: npx jest site
      - name: Build assets
        env:
          # Optional GA4 measurement ID (G-XXXX); unset = no analytics emitted.
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: npm run site:build
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config site/wrangler.jsonc --var SITE_VERSION:${GITHUB_SHA::7}
      - name: Smoke test
        # A first deploy of the custom domain can take a few minutes for DNS and the
        # certificate to go live, so retry patiently (about 5 minutes) before failing.
        run: |
          curl -fsS --retry 30 --retry-delay 10 --retry-all-errors --connect-timeout 10 --max-time 20 \
            https://mentra.ci.computer/healthz
