name: Style canon lint

# Gated like the rest of the org (ci-local runs checks locally); dispatch deliberately.
on:
  workflow_dispatch:

jobs:
  style-canon-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@companionintelligence'
      - run: npx --yes --package @companionintelligence/config ci-lint-canon . --tokens public/brand/tokens/tokens.json
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: scripts/vendor-brand.sh --check
